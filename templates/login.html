{% extends "base.html" %}
{% block body %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card p-4">
      <h3 class="mb-4">Вход</h3>
      <form method="post">
        <div class="mb-3"><label>Логин</label><input name="username" class="form-control" required></div>
        <div class="mb-3"><label>Пароль</label><input name="password" type="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">Войти</button>
      </form>
      <p class="mt-3 text-center">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
    </div>
  </div>
</div>
{% endblock %}
